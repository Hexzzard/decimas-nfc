name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el flujo solo necesita leer el código
permissions:
  contents: read

# Si haces dos push seguidos a la misma rama, cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y probar
        run: ./mvnw -B verify

      - name: Empaquetar para Lambda
        run: ./mvnw -B -Plambda -DskipTests package

  app:
    name: App profesor (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/profesor
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/profesor/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test -- --ci