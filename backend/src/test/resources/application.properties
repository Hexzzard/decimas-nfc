spring.application.name=backend
decimas.persistencia=memoria
# Sin base de datos en las pruebas: desactivamos la configuración automática de DataSource y Flyway
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://example.invalid/.well-known/jwks.json